#
# Cloudflare Workers config for the 짐매니저 AI proxy (server/worker.js).
# Deploy on the FREE tier — no server to babysit (무인/autonomous).
#
#   cd server
#   npx wrangler secret put ANTHROPIC_API_KEY   # your key — stored by Cloudflare, never in the repo
#   npx wrangler deploy
#
# Then point the front-end at the printed URL by editing ai/config.js:
#   export const AI_ENDPOINT = "https://gymmanager-ai-proxy.<subdomain>.workers.dev/api/ai";

name = "gymmanager-ai-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"

# Cost-first defaults (override in the Cloudflare dashboard or here).
# ANTHROPIC_API_KEY is a SECRET — set it with `wrangler secret put`, NOT here.
[vars]
AI_MODEL = "claude-haiku-4-5"
AI_MAX_TOKENS = "700"
AI_EFFORT = "low"
# ALLOW_ORIGIN = "https://clsoftlab-lang.github.io"
