<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="짐매니저 — 운동 서비스업 통합 스마트 웹 플랫폼 (헬스장 운영 SaaS 데모)" />
  <title>짐매니저 · Gym Management SaaS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="주 메뉴">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">🏋️</span>
        <div class="brand-text">
          <strong>짐매니저</strong>
          <small>Gym SaaS</small>
        </div>
      </div>
      <nav id="nav" class="nav" role="navigation"></nav>
      <div class="sidebar-foot">
        <button id="reset-btn" class="btn btn-ghost btn-sm" type="button">데모 데이터 초기화</button>
        <p class="demo-tag">DEMO MODE · 로컬 저장</p>
      </div>
    </aside>

    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn" type="button" aria-label="메뉴 열기/닫기">☰</button>
        <h1 id="page-title" class="page-title">대시보드</h1>
        <div class="topbar-right">
          <div id="global-search-wrap" class="search-wrap">
            <input id="global-search" class="search-input" type="search" placeholder="회원 이름/전화 검색…" aria-label="회원 검색" autocomplete="off" />
          </div>
          <button id="theme-note" class="chip" title="라이트/다크는 시스템 설정을 따릅니다">🌗 자동테마</button>
        </div>
      </header>

      <main id="view" class="view" role="main" aria-live="polite"></main>
    </div>
  </div>

  <!-- Modal host -->
  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title" class="modal-title"></h2>
        <button class="icon-btn" data-close type="button" aria-label="닫기">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="assertive"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
